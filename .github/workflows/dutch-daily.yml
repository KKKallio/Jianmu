name: Publish daily Dutch lesson
on:
  schedule:
    # Two UTC hours cover 07:00 Europe/Amsterdam in CET and CEST.
    - cron: "0 5,6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dutch-daily-lesson
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate and publish
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          TZ: Europe/Amsterdam
        run: python scripts/publish_dutch.py
      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain languages/dutch)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add languages/dutch
            git commit -m "Publish daily Dutch lesson"
            git push
          else
            echo "No lesson changes to publish."
          fi
