name: Build social sharing covers
on:
  push:
    branches: [main]
    paths:
      - 'assets/social/*.svg'
      - '.github/workflows/social-covers.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer and Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install cairosvg
      - name: Render 1200x630 PNG covers
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          for source in sorted(Path('assets/social').glob('*.svg')):
              dest = source.with_suffix('.png')
              cairosvg.svg2png(url=str(source),write_to=str(dest),output_width=1200,output_height=630)
              print(dest)
          PY
      - name: Commit generated PNGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Render social sharing PNG covers"
            git push
          fi
